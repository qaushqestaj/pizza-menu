name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ${{ secrets.EC2_KEY }} ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            # Navigate to your project directory on EC2
            cd /home/ec2-user/pizza-menu

            # Pull the latest code
            git pull origin main

            # Install dependencies
            npm ci
          EOF

      - name: Clean up
        run: rm -f ec2_key.pem
